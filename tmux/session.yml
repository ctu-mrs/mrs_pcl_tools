# do not modify these
root: ./
name: mrs_pcl_tools
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these
pre_window:
  - export UAV_NAME=uav1
  - export USE_SIM_TIME="true"
startup_window: status
windows:
  - zenoh_router:
      layout: tiled
      panes:
        - ros2 run rmw_zenoh_cpp rmw_zenohd
  - lynx_driver:
      layout: tiled
      panes:
        - ros2 launch mrs_pcl_tools test.launch.py 
  - send_command:
      layout: tiled
      panes:
        - echo "hello"