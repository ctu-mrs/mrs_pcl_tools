scope_timer:
  enable: false
  log_filename: ""

lidar3d:

  name:      "ouster"
  frequency: 10       # [Hz]
  vfov:      90       # [deg]

  republish: true
  keep_organized: true

  clip:
    range:
      use: true
      min: 1.1  # [m]
      max: 40.0 # [m]
    intensity:
      use: false
      threshold: 35
      range: 5.0
    reflectivity:
      use: false
      threshold: 25
      range: 5.0

  cropbox:
    use: false
    crop_inside: false # if true, points inside the box will be cropped, otherwise points outside will be cropped
    frame_id: rtk_origin
    min: [-32.0, -35.0, 6.0]
    max: [35.0, 5.0, 19.0]

  downsampling:
    dynamic_row_selection: false
    row_step: 1
    col_step: 1
